<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Friday Report{% endblock %}</title>
  <style>
    /* ── Reset & Base ───────────────────────────────────────── */
    @page {
      size: A4;
      margin: 20mm 18mm 25mm 18mm;
      @bottom-center {
        content: "Generated by Friday PM  |  Page " counter(page) " of " counter(pages);
        font-size: 8pt;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      font-size: 10pt;
      line-height: 1.5;
      color: #1e293b;
      background: #ffffff;
    }

    /* ── Header ──────────────────────────────────────────────── */
    .report-header {
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      color: #ffffff;
      padding: 24px 28px;
      border-radius: 8px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .report-header h1 {
      font-size: 18pt;
      font-weight: 700;
      margin: 0 0 4px 0;
      letter-spacing: -0.02em;
    }

    .report-header .subtitle {
      font-size: 9pt;
      color: #94a3b8;
      font-weight: 400;
    }

    .report-header .logo-placeholder {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16pt;
      font-weight: 700;
      color: #ffffff;
    }

    /* ── Grid System ─────────────────────────────────────────── */
    .row {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }

    .col-2 { flex: 0 0 calc(50% - 8px); }
    .col-3 { flex: 0 0 calc(33.333% - 11px); }
    .col-4 { flex: 0 0 calc(25% - 12px); }
    .col-full { flex: 1 1 100%; }

    /* ── Cards & Sections ────────────────────────────────────── */
    .section {
      margin-bottom: 20px;
      page-break-inside: avoid;
    }

    .section-title {
      font-size: 11pt;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 2px solid #e2e8f0;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
    }

    /* ── Metric Cards ────────────────────────────────────────── */
    .metric-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px 16px;
      text-align: center;
    }

    .metric-card .metric-value {
      font-size: 20pt;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.2;
    }

    .metric-card .metric-label {
      font-size: 8pt;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 4px;
    }

    .metric-card .metric-sub {
      font-size: 8pt;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* ── RAG Indicator ───────────────────────────────────────── */
    .rag-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .rag-indicator.green {
      background: #f0fdf4;
      border: 1px solid #86efac;
    }

    .rag-indicator.amber {
      background: #fffbeb;
      border: 1px solid #fcd34d;
    }

    .rag-indicator.red {
      background: #fef2f2;
      border: 1px solid #fca5a5;
    }

    .rag-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .rag-dot.green { background: #22c55e; }
    .rag-dot.amber { background: #f59e0b; }
    .rag-dot.red { background: #ef4444; }

    .rag-text {
      font-size: 10pt;
    }

    .rag-text .rag-status-label {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .rag-text .rag-rationale {
      font-size: 9pt;
      color: #64748b;
      margin-top: 2px;
    }

    /* ── Progress Bar ────────────────────────────────────────── */
    .progress-bar-container {
      background: #e2e8f0;
      border-radius: 6px;
      height: 12px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.3s ease;
    }

    .progress-bar-fill.green { background: #22c55e; }
    .progress-bar-fill.amber { background: #f59e0b; }
    .progress-bar-fill.red { background: #ef4444; }

    /* ── Tables ───────────────────────────────────────────────── */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 9pt;
    }

    table th {
      background: #f1f5f9;
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
      color: #475569;
      border-bottom: 2px solid #e2e8f0;
      text-transform: uppercase;
      font-size: 8pt;
      letter-spacing: 0.04em;
    }

    table td {
      padding: 8px 12px;
      border-bottom: 1px solid #f1f5f9;
      color: #334155;
    }

    table tr:last-child td {
      border-bottom: none;
    }

    /* ── Bullet Lists ────────────────────────────────────────── */
    .bullet-list {
      list-style: none;
      padding: 0;
    }

    .bullet-list li {
      padding: 6px 0 6px 20px;
      position: relative;
      font-size: 9.5pt;
      color: #334155;
      line-height: 1.5;
    }

    .bullet-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6366f1;
    }

    /* ── Risk severity badges ────────────────────────────────── */
    .risk-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 8pt;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .risk-badge.critical { background: #fef2f2; color: #dc2626; }
    .risk-badge.high { background: #fff7ed; color: #ea580c; }
    .risk-badge.medium { background: #fffbeb; color: #d97706; }
    .risk-badge.low { background: #f0fdf4; color: #16a34a; }

    /* ── Milestone status ────────────────────────────────────── */
    .ms-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 8pt;
      font-weight: 600;
    }

    .ms-status.not_started { background: #f1f5f9; color: #64748b; }
    .ms-status.in_progress { background: #eff6ff; color: #2563eb; }
    .ms-status.blocked { background: #fef2f2; color: #dc2626; }
    .ms-status.completed { background: #f0fdf4; color: #16a34a; }

    /* ── Utilities ────────────────────────────────────────────── */
    .text-muted { color: #94a3b8; }
    .text-small { font-size: 8pt; }
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .mb-2 { margin-bottom: 8px; }
    .font-bold { font-weight: 700; }
    .text-right { text-align: right; }

    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
